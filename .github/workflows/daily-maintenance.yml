name: Daily Maintenance & Backlog Automation

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: devforge-daily-maintenance
  cancel-in-progress: false

jobs:
  run-daily-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Git Author Identity
        run: |
          git config user.name "rudecat01"
          git config user.email "dhruvchaudhary13978@gmail.com"

      - name: Execute Daily Maintenance Tasks
        id: maintenance
        run: |
          python scripts/backlog_runner.py

      - name: Push Verified Commits to Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
